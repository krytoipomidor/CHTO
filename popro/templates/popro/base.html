<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Бронювання кімнат{% endblock %}</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #29382f;
            --muted: #748078;
            --line: #e9e9df;
            --brand: #527a61;
            --brand-dark: #3e624c;
            --accent: #e5a56e;
            --surface: #fffefa;
            --background: #f7f6f0;
            --shadow: 0 14px 38px rgb(56 67 51 / 7%);
        }
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            padding: 0 1.25rem 3rem;
            background:
                radial-gradient(ellipse at 85% 4%, rgb(229 165 110 / 13%), transparent 25rem),
                var(--background);
            color: var(--ink);
            font: 16px/1.65 system-ui, -apple-system, "Segoe UI", sans-serif;
        }
        a { color: var(--brand-dark); text-decoration-thickness: 1px; text-underline-offset: 3px; }
        a:hover { color: var(--brand); }
        .site-header { border-bottom: 1px solid rgb(233 233 223 / 80%); }
        .header-inner, .page-shell, .site-footer { width: min(100%, 940px); margin-inline: auto; }
        .header-inner { min-height: 82px; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
        .brand { display: inline-flex; align-items: center; gap: .7rem; color: var(--ink); font-size: 1.08rem; font-weight: 750; text-decoration: none; }
        .brand-mark { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 13px; background: #e8eee6; color: var(--brand-dark); }
        .brand-mark svg { width: 21px; height: 21px; }
        nav { display: flex; flex-wrap: wrap; gap: .4rem; }
        nav a {
            padding: .45rem .8rem;
            border-radius: 999px;
            color: #536257;
            font-size: .94rem;
            font-weight: 600;
            text-decoration: none;
            transition: background .15s, color .15s;
        }
        nav a:hover { background: #e9eee6; color: var(--brand-dark); }
        .page-shell { padding-top: 2.8rem; }
        h2 { margin-top: 0; font-size: clamp(1.55rem, 4vw, 2rem); letter-spacing: -.035em; line-height: 1.2; }
        h3 { margin-top: 0; letter-spacing: -.015em; }
        .eyebrow { margin: 0 0 .6rem; color: var(--brand); font-size: .78rem; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
        .intro { max-width: 700px; margin-bottom: 2rem; }
        .intro h2 { max-width: 620px; margin-bottom: .75rem; font-size: clamp(2rem, 5vw, 3.2rem); letter-spacing: -.055em; }
        .intro p:last-child { max-width: 600px; margin: 0; color: var(--muted); font-size: 1.08rem; }
        .section-heading { margin: 2.4rem 0 1rem; }
        .section-heading h2 { margin-bottom: .35rem; font-size: 1.45rem; }
        .section-heading p { margin: 0; color: var(--muted); }
        .form-panel { max-width: 650px; }
        .unstyled-form { margin: 0; padding: 0; border: 0; border-radius: 0; background: transparent; box-shadow: none; }
        .form-intro { margin: -.25rem 0 1rem; color: var(--muted); }
        .success-mark { width: 52px; height: 52px; display: grid; place-items: center; margin-bottom: 1rem; border-radius: 17px; background: #e8eee6; color: var(--brand-dark); font-size: 1.55rem; }
        summary { color: var(--brand-dark); font-weight: 650; cursor: pointer; }
        details p { margin-bottom: 0; }
        .room-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 1rem; }
        .card, form {
            margin-bottom: 1rem;
            padding: clamp(1.2rem, 3vw, 1.7rem);
            border: 1px solid var(--line);
            border-radius: 20px;
            background: var(--surface);
            box-shadow: var(--shadow);
        }
        .filter-card { padding: clamp(1.2rem, 3vw, 1.8rem); }
        .filter-card h2 { margin-bottom: .35rem; font-size: 1.3rem; }
        .filter-card > p { margin: 0; color: var(--muted); }
        .filter-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .8rem; margin-top: 1rem; }
        .card { display: flex; flex-direction: column; align-items: flex-start; transition: transform .18s ease, box-shadow .18s ease; }
        .card:hover { transform: translateY(-2px); box-shadow: 0 18px 42px rgb(56 67 51 / 11%); }
        .room-type { margin-bottom: .75rem; padding: .22rem .65rem; border-radius: 999px; background: #edf2eb; color: var(--brand-dark); font-size: .8rem; font-weight: 700; }
        .card h3 { margin-bottom: .35rem; font-size: 1.3rem; }
        .card p { margin: .4rem 0 .8rem; color: var(--muted); }
        .room-meta { font-size: .94rem; }
        .room-price { margin-top: auto !important; color: var(--ink) !important; font-size: 1.02rem; font-weight: 700; }
        .button, button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: .65rem 1rem;
            border: 0;
            border-radius: 11px;
            background: var(--brand);
            color: #fff;
            font: inherit;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: background .15s, transform .15s;
        }
        .button:hover, button:hover { transform: translateY(-1px); background: var(--brand-dark); color: #fff; }
        label { display: block; margin-top: .3rem; font-weight: 650; font-size: .93rem; }
        input, select, textarea {
            display: block;
            width: 100%;
            margin-top: .3rem;
            padding: .72rem .8rem;
            border: 1px solid #dcded4;
            border-radius: 11px;
            background: #fffefa;
            color: var(--ink);
            font: inherit;
        }
        input:focus, select:focus, textarea:focus {
            border-color: var(--brand);
            outline: 3px solid rgb(82 122 97 / 16%);
        }
        button { margin-top: 1rem; }
        .filter-grid + button { margin-top: 1rem; }
        button:focus-visible, a:focus-visible { outline: 3px solid #b8cdb9; outline-offset: 3px; }
        .errorlist { margin: .3rem 0; padding-left: 1.2rem; color: #a4473d; }
        .muted { color: var(--muted); }
        .empty-state, .notice { padding: 1.25rem; border: 1px dashed #d9ddcf; border-radius: 16px; background: rgb(255 254 250 / 75%); color: var(--muted); }
        .notice { border-style: solid; }
        .site-footer { margin: 3rem auto 0; padding-top: 1rem; border-top: 1px solid var(--line); color: var(--muted); font-size: .86rem; }
        .site-footer a { color: inherit; }
        @media (max-width: 600px) {
            body { padding: 0 1rem 2rem; }
            .header-inner { min-height: 72px; }
            .brand { font-size: 1rem; }
            .brand-mark { width: 34px; height: 34px; }
            nav { gap: .1rem; }
            nav a { padding: .4rem .55rem; font-size: .88rem; }
            .page-shell { padding-top: 2rem; }
            .filter-grid { grid-template-columns: 1fr; gap: .4rem; }
            .intro { margin-bottom: 1.5rem; }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a class="brand" href="{% url 'popro:room_list' %}">
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9h13v-9M9 19v-5h6v5"/></svg>
                </span>
                Затишно
            </a>
            <nav aria-label="Головна навігація">
                <a href="{% url 'popro:room_list' %}">Знайти кімнату</a>
                <a href="{% url 'popro:create_booking' %}">Моє бронювання</a>
            </nav>
        </div>
    </header>
    <main class="page-shell">{% block content %}{% endblock %}</main>
    <footer class="site-footer">Потрібно керувати кімнатами? <a href="{% url 'admin:index' %}">Вхід для адміністратора</a></footer>
</body>
</html>
